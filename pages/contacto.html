<!DOCTYPE html>

<!-- ============================================================
     CONTACTO.HTML
     Formulario de contacto
     ============================================================ -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Contacto | Red Goat Eyes </title>
    <meta name="description" content=" Escríbenos tus consultas, reclamos o sugerencias ">
    <meta name="keywords" content=" ropa urbana, unisex, ecuador - quito, streetwear ">
    <link rel="icon" type="image/png" href="../assets/img/icons/RedGoatEyesIcon.png">

    <!-- ---------------- Hojas de estilo ---------------- -->
    <!-- El orden importa: responsive va al final para poder sobrescribir -->
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
          integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer">
</head>
<body>


    <!-- ---------------- Cabecera ---------------- -->
    <!-- Se repite igual en las 13 paginas -->
    <header class="site-header">


        <!-- ---------------- Barra superior de ubicacion ---------------- -->
        <div class="top-bar">
            <div class="location">
                <i class="fa-solid fa-location-dot"></i>
                <span> Quito </span>
            </div>
        </div>


        <!-- ---------------- Barra de navegacion ---------------- -->
        <nav class="navbar">
            <div class="logo">
                <a href="../index.html">
                    <img src="../assets/img/banners/RedGoatEyesBanner.png" alt="Red Goat Eyes logo banner">
                </a>
            </div>


            <!-- ---------------- Boton hamburguesa ---------------- -->
            <!-- Solo se ve en pantallas menores a 768px -->
            <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Abrir menú" aria-expanded="false">
                <i class="fa-solid fa-bars"></i>
            </button>


            <!-- ---------------- Enlaces del menu ---------------- -->
            <ul class="nav-links" id="nav-links">
                <li><a href="../index.html"> Inicio </a></li>

                <li class="dropdown">
                    <a href="categorias.html"> Categorías <i class="fa-solid fa-chevron-down"></i></a>
                    <ul class="dropdown-menu">
                        <li><a href="hoodies.html">Hoodies</a></li>
                        <li><a href="pantalones.html">Pantalones</a></li>
                        <li><a href="accesorios.html">Accesorios</a></li>
                    </ul>
                </li>

                <li><a href="productos.html"> Productos </a></li>
                <li><a href="contacto.html"> Contacto </a></li>
            </ul>


            <!-- ---------------- Iconos de carrito y usuario ---------------- -->
            <div class="nav-icons">
                <a href="carrito.html" class="icono-carrito" aria-label="Ver carrito">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="carrito-contador" class="cart-count"> 0 </span>
                </a>

                <div class="usuario-menu">
                    <button type="button" class="btn-usuario" id="btn-usuario" aria-label="Mi cuenta" aria-expanded="false">
                        <i class="fa-regular fa-user"></i>
                    </button>


                    <!-- ---------------- Menu desplegable del usuario ---------------- -->
                    <!-- Las clases solo-invitado y solo-cliente las controla el JavaScript segun la sesion -->
                    <ul class="usuario-dropdown" id="usuario-dropdown">
                        <li class="usuario-saludo solo-cliente" id="usuario-saludo"></li>
                        <li class="solo-invitado"><a href="login.html"> Iniciar sesión </a></li>
                        <li class="solo-invitado"><a href="registro.html"> Crear cuenta </a></li>
                        <li class="solo-cliente"><a href="carrito.html"> Mi carrito </a></li>
                        <li class="solo-cliente"><button type="button" id="btn-salir"> Cerrar sesión </button></li>
                    </ul>
                </div>

            </div>

        </nav>

    </header>

    <main>


        <!-- ---------------- Formulario de contacto ---------------- -->
        <section class="contact-container">
            <h1> Contacto </h1>

            <!-- ---------------- Formulario ---------------- -->
            <!-- El mensaje se guarda en la base y ademas se avisa por correo al administrador -->
            <form id="contactForm" novalidate>

                <div class="form-group">
                    <label for="nombre"> Nombre </label>
                    <input type="text" id="nombre" name="nombre" autocomplete="name" required>
                    <small class="error"></small>
                </div>

                <div class="form-group">
                    <label for="ciudad"> Ciudad </label>
                    <input type="text" id="ciudad" name="ciudad" autocomplete="address-level2" required>
                    <small class="error"></small>
                </div>

                <div class="form-group">
                    <label for="email"> Correo </label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                    <small class="error"></small>
                </div>

                <div class="form-group">
                    <label for="asunto"> Asunto </label>

                    <!-- ---------------- Menu de asuntos ---------------- -->
                    <!-- El JavaScript lo llena desde la base: Consulta, Reclamo y Sugerencia -->
                    <select id="asunto" name="asunto" required>
                        <option value=""> Seleccione un asunto </option>
                        <option value="consulta"> Consulta </option>
                        <option value="reclamo"> Reclamo </option>
                        <option value="sugerencia"> Sugerencia </option>
                    </select>
                    <small class="error"></small>
                </div>

                <div class="form-group">
                    <label for="descripcion"> Descripción </label>
                    <textarea id="descripcion" name="descripcion" rows="5" required></textarea>
                    <small class="error"></small>
                </div>

                <div class="form-group">
                    <label for="foto"> Foto (Opcional) </label>
                    <input type="file" id="foto" name="foto" accept="image/png, image/jpeg, image/webp">
                    <small class="error"></small>
                </div>

                <button type="submit"> Enviar formulario </button>

            </form>
        </section>

    </main>


    <!-- ---------------- Pie de pagina ---------------- -->
    <footer class="footer">

        <div class="footer-top">

            <div class="footer-left">
                <p> Copyright © 2026 <strong> Red Goat Eyes </strong> | Creacion propia por niicofel &amp; Elian &amp; Rafael </p>
            </div>

        </div>

    </footer>


    <!-- ---------------- Scripts ---------------- -->
    <!-- carrito-contador va primero porque los demas usan sus funciones -->
    <script src="../assets/js/carrito-contador.js"></script>
    <script src="../assets/js/menu.js"></script>
    <script src="../assets/js/validaciones.js"></script>

</body>
</html>
